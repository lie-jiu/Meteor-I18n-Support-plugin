name: Manual Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0). Empty for snapshot build.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
            persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build with Gradle
        run: ./gradlew build

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          repo_token: '${{ secrets.GITHUB_TOKEN }}'
          tag_name: "${{ inputs.tag || 'snapshot' }}"
          prerelease: ${{ inputs.tag == '' }}
          name: "${{ inputs.tag || 'Dev Build' }}"
          files: |
            ./build/libs/*.jar
